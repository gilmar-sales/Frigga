name: CMake

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - mkdocs.yml
  pull_request:
    branches: ["main"]
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            c_compiler: gcc
            cxx_compiler: g++
          - os: windows-latest
            c_compiler: C:/mingw64-gcc16/bin/gcc.exe
            cxx_compiler: C:/mingw64-gcc16/bin/g++.exe

    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.2.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "deb http://archive.ubuntu.com/ubuntu stonking main universe" | sudo tee /etc/apt/sources.list.d/stonking-toolchain.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -t stonking --no-install-recommends \
            gcc-16 g++-16 glslc ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev \
            libpulse-dev libasound2-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-16 \
            --slave /usr/bin/gcov gcov /usr/bin/gcov-16
          sudo update-alternatives --set gcc /usr/bin/gcc-16
          gcc --version
          g++ --version
          gcc --version | grep -E '16\.2'
          g++ --version | grep -E '16\.2'

      - name: Windows glslc
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Remember glslc
        if: runner.os == 'Windows'
        shell: bash
        run: echo "GLSLC_DIR=$(dirname "$(command -v glslc)")" >> "$GITHUB_ENV"

      - name: Vulkan
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.328.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Cache MinGW
        if: runner.os == 'Windows'
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: C:\mingw64-gcc16
          key: mingw64-gcc16-16.2.0-rt_v14-rev1-posix-seh-ucrt

      - name: Install MinGW
        if: runner.os == 'Windows' && steps.cache-mingw.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/x86_64-16.2.0-release-posix-seh-ucrt-rt_v14-rev1.7z'
          $zip = "$env:TEMP\mingw64.7z"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Remove-Item -Recurse -Force C:\mingw64-scratch -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path C:\mingw64-scratch | Out-Null
          & 7z.exe x $zip "-oC:\mingw64-scratch\" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed: $LASTEXITCODE" }
          $extracted = Get-ChildItem C:\mingw64-scratch -Directory | Select-Object -First 1
          Remove-Item -Recurse -Force C:\mingw64-gcc16 -ErrorAction SilentlyContinue
          Move-Item $extracted.FullName C:\mingw64-gcc16

      - name: Windows PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "C:/mingw64-gcc16/bin" >> "$GITHUB_PATH"
          echo "${GLSLC_DIR}" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER="${{ matrix.c_compiler }}" \
            -DCMAKE_CXX_COMPILER="${{ matrix.cxx_compiler }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DFRIGGA_VERSION="${{ steps.version.outputs.version }}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Test
        working-directory: build
        shell: bash
        run: ctest --output-on-failure -C Release

      - name: Stage
        shell: bash
        run: |
          mkdir -p publish
          if [[ -f build/Editor ]]; then
            cp build/Editor publish/
          elif [[ -f build/Editor.exe ]]; then
            cp build/Editor.exe publish/
          else
            echo "Editor not found"; exit 1
          fi
          cp -a build/Resources publish/
          cp -a build/Sdk publish/
          test -f publish/Sdk/src/Frigga/Module/frigga_module.h
          find publish/Resources/Shaders -name '*.spv' | grep -q .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frigga-${{ matrix.os }}-Release
          path: publish/*
          if-no-files-found: error

      - name: Release zip
        if: github.event_name == 'release'
        id: pack
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-26.04) PLATFORM=linux ;;
            windows-latest) PLATFORM=windows ;;
            *) PLATFORM="${{ matrix.os }}" ;;
          esac
          ASSET="Frigga-${PLATFORM}-Release"
          python -c "import shutil; shutil.make_archive('${ASSET}', 'zip', 'publish')"
          echo "asset=${ASSET}.zip" >> "$GITHUB_OUTPUT"

      - name: Attach release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.asset }}
          fail_on_unmatched_files: true
